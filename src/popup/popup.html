<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notionish</title>
    <link rel="stylesheet" href="../vendor/tokens.css" />
    <link rel="stylesheet" href="../vendor/webext-ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup stack">
    <header class="cluster">
      <span class="dot" id="dot"></span>
      <h1>Notionish</h1>
    </header>

    <p class="status" id="status">Checking this tab…</p>

    <label class="row" id="enable-row">
      <span id="enable-label">Enabled here</span>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
      </span>
    </label>

    <button class="btn btn-primary btn-block" id="action">
      Show Google's UI on this tab
    </button>

    <button class="btn btn-block" id="disable">Turn Notionish off</button>

    <p class="hint">
      <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> does the same · reloading the
      page brings Notionish back · <a href="#" id="options">Open options</a>
    </p>

    <script src="../vendor/webext.js"></script>
    <script src="../settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
